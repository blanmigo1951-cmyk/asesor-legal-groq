<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asesor Legal Constitucional - Groq AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 h-screen flex flex-col">

    <header class="bg-slate-900 border-b border-slate-800 p-4 shadow-md flex justify-between items-center">
        <h1 class="text-xl font-bold text-orange-400">⚡ Asesor Legal Constitucional (Groq Powered)</h1>
        <span class="text-xs bg-orange-950 text-orange-300 px-3 py-1 rounded-full border border-orange-700">LPU Inference Active</span>
    </header>

    <main id="chat-container" class="flex-1 overflow-y-auto p-4 space-y-4 max-w-4xl w-full mx-auto">
        <div class="flex items-start space-x-3">
            <div class="bg-orange-600 text-white rounded-full h-8 w-8 flex items-center justify-center font-bold text-xs shrink-0">IA</div>
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-4 max-w-2xl text-sm leading-relaxed">
                ¡Hola! Sistema de asesoría jurídica conectado a Groq. Cuéntame tu caso legal o sube evidencias de tu galería (fotos, documentos). Diseñaré la mejor estrategia constitucional a tu favor de forma inmediata.
            </div>
        </div>
    </main>

    <footer class="bg-slate-900 border-t border-slate-800 p-4">
        <form id="chat-form" class="max-w-4xl mx-auto flex items-center gap-2">
            <label for="file-input" class="cursor-pointer bg-slate-800 hover:bg-slate-700 text-slate-300 p-3 rounded-xl transition flex items-center justify-center text-lg">
                ➕
            </label>
            <input type="file" id="file-input" class="hidden" accept="image/*,video/*,.pdf,.doc,.docx">

            <input type="text" id="mensaje-input" placeholder="Expón tu problema legal aquí..." 
                class="flex-1 bg-slate-950 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-orange-500">

            <button type="submit" class="bg-orange-600 hover:bg-orange-500 text-white px-6 py-3 rounded-xl text-sm font-medium transition">
                Enviar
            </button>
        </form>
        <div id="file-indicator" class="max-w-4xl mx-auto text-xs text-orange-400 mt-2 hidden"></div>
    </footer>

    <script>
        const form = document.getElementById('chat-form');
        const input = document.getElementById('mensaje-input');
        const fileInput = document.getElementById('file-input');
        const chatContainer = document.getElementById('chat-container');
        const fileIndicator = document.getElementById('file-indicator');

        let archivoSeleccionado = null;

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                archivoSeleccionado = e.target.files[0];
                fileIndicator.textContent = `📎 Evidencia lista: ${archivoSeleccionado.name}`;
                fileIndicator.classList.remove('hidden');
            }
        });

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const texto = input.value.trim();
            if (!texto && !archivoSeleccionado) return;

            appendMessage(texto, 'user', archivoSeleccionado ? archivoSeleccionado.name : null);
            
            const formData = new FormData();
            formData.append('mensaje', texto);
            if (archivoSeleccionado) {
                formData.append('archivo', archivoSeleccionado);
            }

            input.value = '';
            fileInput.value = '';
            fileIndicator.classList.add('hidden');
            archivoSeleccionado = null;

            const loadingId = appendMessage("Procesando con la velocidad de Groq LPU...", 'ai');

            try {
                const response = await fetch('http://localhost:8000/api/chat', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                
                document.getElementById(loadingId).remove();
                appendMessage(data.respuesta, 'ai');
            } catch (error) {
                document.getElementById(loadingId).remove();
                appendMessage("Error de conexión real con el backend de FastAPI y Groq.", 'ai');
            }
        });

        function appendMessage(text, sender, fileName = null) {
            const messageId = 'msg-' + Date.now();
            const isUser = sender === 'user';
            
            const wrapper = document.createElement('div');
            wrapper.id = messageId;
            wrapper.className = `flex items-start space-x-3 ${isUser ? 'flex-row-reverse space-x-reverse' : ''}`;
            
            const avatar = document.createElement('div');
            avatar.className = `${isUser ? 'bg-indigo-600' : 'bg-orange-600'} text-white rounded-full h-8 w-8 flex items-center justify-center font-bold text-xs shrink-0`;
            avatar.textContent = isUser ? 'US' : 'IA';

            const bubble = document.createElement('div');
            bubble.className = `${isUser ? 'bg-indigo-950 border-indigo-900' : 'bg-slate-900 border-slate-800'} border rounded-2xl p-4 max-w-2xl text-sm leading-relaxed`;
            
            let content = isUser ? `<p>${text}</p>` : marked.parse(text);
            if (fileName) {
                content += `<p class="text-xs text-orange-400 mt-2">📎 Archivo adjunto: ${fileName}</p>`;
            }
            bubble.innerHTML = content;

            wrapper.appendChild(avatar);
            wrapper.appendChild(bubble);
            chatContainer.appendChild(wrapper);
            chatContainer.scrollTop = chatContainer.scrollHeight;

            return messageId;
        }
    </script>
</body>
</html>
